name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deps: [requirements.txt, requirements-ai.txt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ${{ matrix.deps }} --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
