      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4dee8"/>
    </linearGradient>
    <linearGradient id="cobaltCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
